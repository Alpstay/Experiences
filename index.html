    (function(){
      var firebaseConfig = {
        apiKey: "AIzaSyCSGiZFdXdZoq2T5nQ1bscY5M0YbkXeu1E",
        authDomain: "experiencesalpstay.firebaseapp.com",
        projectId: "experiencesalpstay",

        messagingSenderId: "915499459943",
        appId: "1:915499459943:web:d5954b290c6efee8987bc2"
      };
      var tries = 0;
      function initFirebase(){
        if(typeof firebase === "undefined" || !firebase.firestore){
          tries++;
          if(tries < 150){ setTimeout(initFirebase, 100); return; }
          console.warn("Firebase non caricato — l'app funziona senza salvataggio dati");
          return;
        }
        try {
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();
        window.firebaseDB = db;
        window.firebaseModules = {
          doc: function(dbRef, coll, id){ return dbRef.collection(coll).doc(id); },
          getDoc: function(ref){ return ref.get().then(function(s){ return { exists:function(){return s.exists;}, data:function(){return s.data();}, id:s.id }; }); },
          setDoc: function(ref, data){ return ref.set(data); },
          updateDoc: function(ref, data){ return ref.update(data); },
          deleteDoc: function(ref){ return ref.delete(); },
          collection: function(dbRef, name){ return dbRef.collection(name); },
          addDoc: function(collRef, data){ return collRef.add(data); },
          getDocs: function(q){ return q.get(); },
          query: function(collRef){ var cs=[].slice.call(arguments,1); var r=collRef; for(var i=0;i<cs.length;i++){ r=cs[i](r); } return r; },
          orderBy: function(field, dir){ return function(ref){ return ref.orderBy(field, dir||"asc"); }; },
          serverTimestamp: function(){ return firebase.firestore.FieldValue.serverTimestamp(); },
          runTransaction: function(dbRef, fn){
            return dbRef.runTransaction(function(tx){
              var wrapped = {
                get: function(ref){ return tx.get(ref).then(function(s){ return { exists:function(){return s.exists;}, data:function(){return s.data();} }; }); },
                set: function(ref, data){ return tx.set(ref, data); },
                update: function(ref, data){ return tx.update(ref, data); }
              };
              return fn(wrapped);
            });
          }
        };
        console.log("\u2705 Firebase compat connesso");
        } catch(e){ console.error("Firebase init error:", e); }
      }
      initFirebase();
    })();

class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={hasError:false, msg:""}; }
  static getDerivedStateFromError(error){ return {hasError:true, msg:String(error&&error.message||error)}; }

  }
}

.email-tab.active{background:var(--gold);border-color:var(--gold);color:var(--white);}
.email-body-text{padding:1rem 1.2rem;font-family:monospace;font-size:.7rem;color:var(--muted);line-height:1.65;max-height:220px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;background:#fff;}
.email-actions{display:flex;gap:.6rem;padding:.85rem 1.2rem;border-top:1px solid var(--border);flex-wrap:wrap;}
.btn-email-action{font-family:'Lato',sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.55rem 1.1rem;border-radius:var(--r);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.4rem;border:none;}
.btn-copy{background:var(--gold);color:var(--white);}
.btn-copy:hover{background:var(--gold-b);}
.btn-copy.done{background:#2E7D32;}
.btn-mailto{background:var(--gold);color:var(--white);}
.btn-mailto:hover{background:var(--gold-b);}
.email-note{padding:.6rem 1.2rem;font-size:.68rem;color:var(--subtle);font-weight:300;border-top:1px solid var(--border);text-align:center;line-height:1.5;}
.sending-overlay{position:fixed;inset:0;background:rgba(26,26,26,.95);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--white);backdrop-filter:blur(6px);}
.sending-spinner{width:40px;height:40px;border:1.5px solid rgba(166,124,82,.2);border-top:1.5px solid var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:1.5rem;}
@keyframes spin{to{transform:rotate(360deg);}}
.sending-txt{font-family:'Belleza',serif;font-size:1.1rem;color:var(--gold-light);font-style:italic;}
.sending-sub{font-size:.75rem;color:rgba(255,255,255,.35);margin-top:.4rem;font-weight:300;letter-spacing:.04em;}
`;

// Copy text to clipboard
async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // Fallback: create textarea
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }
}

// Open mailto: with pre-filled content (works on all devices/email clients)
function openMailto(to, subject, body) {
  const maxLen = 1800; // safe URL length for most email clients
  const shortBody = body.length > maxLen ? body.slice(0, maxLen) + "\n\n[...]" : body;
  const url = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(shortBody)}`;
  window.open(url, "_blank");
}

// ─── BOOKING NUMBER ────────────────────────────────────────────────────────────
async function getNextBookingNumber() {
  // Firebase Firestore integration (requires config below)
  // Falls back to localStorage counter if Firebase not available
  try {
    if(window.firebaseDB) {
      const { doc, runTransaction, serverTimestamp } = window.firebaseModules;
      const counterRef = doc(window.firebaseDB, "config", "bookingCounter");
      const newNum = await runTransaction(window.firebaseDB, async (tx) => {
        const snap = await tx.get(counterRef);
        const current = snap.exists() ? snap.data().value : 420;
        const next = current + 1;
        tx.set(counterRef, { value: next, updatedAt: serverTimestamp() });
        return next;
      });
      return `${new Date().getFullYear()}/${String(newNum).padStart(3,"0")}`;
    }
  } catch(e) { console.warn("Firebase not configured, using local counter:", e); }
  // Local fallback
  try {
    const r = await window.storage?.get("booking-counter");
    const n = r ? (parseInt(r.value)||420)+1 : 421;
    await window.storage?.set("booking-counter", String(n));
    return `${new Date().getFullYear()}/${String(n).padStart(3,"0")}`;
  } catch(e) {
    return `${new Date().getFullYear()}/001`;
  }
}

      const img = new Image();

        const canvas = document.createElement("canvas");
        const maxW = 700;
        const scale = Math.min(1, maxW/img.width);
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        let quality = 0.7;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);
        // Riduci qualità se troppo grande (>200KB)
        while(dataUrl.length > 270000 && quality > 0.3){

          dataUrl = canvas.toDataURL("image/jpeg", quality);

                <div className="mood-pills">{((m.pills&&(m.pills[lang]||m.pills.en))||[]).map((p,i)=><span key={i} className="mood-pill">{p}</span>)}</div>
                {vt(m,"itinerary",lang)&&<span className="mood-itin">&#128205; {vt(m,"itinerary",lang)}</span>}
                <button className="btn-mood" onClick={e=>{e.stopPropagation();setDetailMood(m);}}>{s.moodBtn}</button>
              </div>
            </div>
          ))}
        </div>

        <div className="rent-section">
          <p className="rent-title">{s.rentTitle}</p>
          <div className="rent-grid">
            {VEHICLES.map(v=>{
              const minPrice = Math.min(...Object.values(v.prices));
              const rentLabels = {
                vespa:{it:"Noleggio Vespa",de:"Vespa mieten",en:"Rent a Vespa",zh:"租Vespa"},
                topolino:{it:"Noleggio Topolino",de:"Topolino mieten",en:"Rent a Topolino",zh:"租Topolino"},
                jaguar:{it:"Esperienza Jaguar",de:"Jaguar Erlebnis",en:"Jaguar Experience",zh:"Jaguar体验"},
              };
              return (
                <div key={v.id} className="rent-card" onClick={()=>{upd("vehicleId",v.id);upd("addons",[]);upd("vehicleQty",1);setStep(1);}}>
                  <div className="rent-photo">{(()=>{const ps=v.photoImg==="__CUSTOM__"?v.customPhoto:IMG[v.photoImg];return (v.hasPhoto&&ps)?<img src={ps} alt={v.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:"100%",height:"100%",background:v.gradient||"linear-gradient(135deg,#2E2F2E,#A68A63)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"2rem"}}>{v.icon||"🚗"}</div>;})()}</div>
                  <div className="rent-info">
                    <span className="rent-name">{(rentLabels[v.id]||{})[lang]||v.name}</span>
                    <span className="rent-from">{s.rentFrom} {fmt(minPrice)}</span>
                    <button className="btn-rent">{s.rentBook}</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
        <div className="mood-skip"><span onClick={()=>setStep(1)}>{s.moodSkip}</span></div>

        {/* ── ACCESSO BACKOFFICE (in fondo alla pagina) ── */}
        <div style={{textAlign:"center",padding:"2.5rem 1rem 1.5rem",borderTop:"1px solid #EEE",marginTop:"2rem"}}>
          {!showAdmin ? (
            <button onClick={()=>setShowAdmin(true)}
              style={{background:"none",border:"none",cursor:"pointer",fontSize:".68rem",letterSpacing:".15em",textTransform:"uppercase",color:"#C8C0B4",fontWeight:600}}>
              · Area Riservata ·
            </button>
          ) : !adminUnlocked ? (
            <div style={{maxWidth:300,margin:"0 auto"}}>
              <div style={{fontSize:".7rem",letterSpacing:".2em",textTransform:"uppercase",color:"var(--gold)",marginBottom:".8rem",fontWeight:700}}>Backoffice — Accesso</div>
              <input type="password" value={adminPwd} onChange={e=>setAdminPwd(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&adminUnlock()} placeholder="Password"
                style={{width:"100%",padding:".7rem",border:"1.5px solid var(--border)",borderRadius:8,fontSize:".9rem",marginBottom:".6rem",textAlign:"center"}}/>
              <div style={{display:"flex",gap:".5rem"}}>
                <button onClick={()=>{setShowAdmin(false);setAdminPwd("");}} style={{flex:1,padding:".6rem",background:"#fff",border:"1.5px solid var(--border)",borderRadius:8,fontSize:".75rem",fontWeight:600}}>Annulla</button>
                <button onClick={adminUnlock} style={{flex:1,padding:".6rem",background:"var(--gold)",color:"#fff",border:"none",borderRadius:8,fontSize:".75rem",fontWeight:700}}>Accedi</button>
              </div>
            </div>
          ) : (
            AdminPanel()
          )}
        </div>
      </div>}

      {step===0&&detailMood&&(()=>{
        const m = detailMood;
        const v = VEHICLES.find(x=>x.id===m.vehicleId);
        const prog = v&&PROGRAMS[v.id];
        const vPrice = v&&m.duration?(v.prices[m.duration]||0):0;
        const addTot = (m.addons||[]).reduce((sum,id)=>{const a=ADDONS.find(x=>x.id===id);return sum+(a?.price||0);},0);
        const total = vPrice + addTot;
        return (
          <div className="detail-screen">
            <div style={{background:"#fff",borderBottom:"1px solid #E8E0D4"}}><Header/></div>
            <div className="detail-header">
              <button className="detail-back" onClick={()=>{setDetailMood(null);history.pushState("",document.title,window.location.pathname);}}>{s.detailBack}</button>
              <div className="detail-stripe" style={{background:m.stripe}}/>
              <span className="detail-emoji">{m.emoji}</span>
              <div className="detail-theme">{vt(m,"names",lang)}</div>
              <span className="detail-sub">{vt(m,"subs",lang)}</span>
              <p className="detail-desc">{vt(m,"desc",lang)}</p>
            </div>
            <div className="detail-body">
              {prog&&<>
                <span className="detail-section-lbl">{s.detailRoute}</span>
                <div className="detail-stops">
                  {(prog.stops[lang]||prog.stops.en).map((stop,i)=>(
                    <div key={i} className="detail-stop"><span className="detail-stop-dot"/><span>{stop}</span></div>
                  ))}
                </div>
              </>}
              <span className="detail-section-lbl">{s.detailIncl}</span>
              <div className="detail-includes">
                {v&&<div className="detail-include-row">
                  <span className="detail-include-name">{v.name} &nbsp;&#183;&nbsp; {m.duration} {s.ore}</span>
                  <span className="detail-include-price">{fmt(vPrice)}</span>
                </div>}
                {(m.addons||[]).map(id=>{const a=ADDONS.find(x=>x.id===id);return a?(<div key={id} className="detail-include-row"><span className="detail-include-name">{a.icon} {vt(a,"names",lang)}</span><span className="detail-include-price">{fmt(a.price)}</span></div>):null;})}
              </div>
              <div className="detail-total-box">
                <span className="detail-total-lbl">{s.detailTotal}</span>
                <span className="detail-total-val">{fmt(total)}</span>
              </div>
              <button className="btn-book-exp" onClick={()=>{upd("vehicleId",m.vehicleId);upd("addons",m.addons||[]);if(m.vehicleQty)upd("vehicleQty",m.vehicleQty);setDetailMood(null);setStep(1);}}>
                {s.detailBookBtn}
              </button>
            </div>
          </div>
        );
      })()}

      {step>0&&<>
        <div className="steps">
          {s.steps.map((lbl,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center"}}>
              <div className="st-item">
                <div className={`st-num ${step===i+1?"active":step>i+1?"done":"todo"}`}>{step>i+1?"✓":i+1}</div>
                <span className={`st-lbl ${step===i+1?"active":""}`}>{lbl}</span>
              </div>
              {i<4&&<div className="st-line"/>}
            </div>
          ))}
        </div>
        <div className="home-bar">
          <button className="btn-home-link" onClick={()=>{setStep(0);upd("vehicleId",null);upd("addons",[]);upd("vehicleQty",1);setDetailMood&&setDetailMood(null);}}>
            {{"it":"⌂ Torna alla Home","de":"⌂ Zur Startseite","en":"⌂ Back to Home","zh":"⌂ 返回首页"}[lang]}
          </button>
        </div>
      </>}

      <div className="content">
        {sendError&&<div className="alert-err">{sendError}</div>}

        {/* STEP 1 — VEHICLE */}
        {step===1&&<>
          <h2 className="sec-title">{s.s1t}</h2>
          <p className="sec-sub">{s.s1s}</p>
          {errors.vehicleId&&<div className="alert">&#9888; {errors.vehicleId}</div>}
          <div className="v-grid">
            {VEHICLES.map(v=>(
              <div key={v.id} className={`v-card${b.vehicleId===v.id?" sel":""}`}>
                <VehicleHead v={v}/>
                <div className="v-body">
                  <div className="v-name-row">
                    <span className="v-tag-inline">{vt(v,"tags",lang)}</span>
                    <div className="v-name">{v.name}</div>
                  </div>
                  <p className="v-desc">{vt(v,"descs",lang)}</p>
                  <div className="v-specs">{(vt(v,"specs",lang)||[]).map(sp=><span className="v-spec" key={sp}>{sp}</span>)}</div>
                  <div className="v-prices">
                    {[2,4,6].map(h=>{
                      const isSelected = b.vehicleId===v.id && b.duration===h;
                      return (
                        <div key={h}
                          className={`v-pr-item${isSelected?" sel":h===6?" highlight":""}`}
                          onClick={e=>{e.stopPropagation();upd("vehicleId",v.id);if(v.id!=="vespa")upd("vehicleQty",1);upd("duration",h);}}
                        >
                          <span className="v-pr-h">{h} {s.ore}</span>
                          <span className="v-pr-a">{fmt(v.prices[h]*(v.id==="vespa"?b.vehicleQty:1))}</span>
                        </div>
                      );
                    })}
                  </div>
                  {v.maxQty&&b.vehicleId===v.id&&(
                    <div className="vespa-qty-wrap">
                      <span className="vespa-qty-label">{s.qtyLabel}</span>
                      <div className="vespa-qty-btns">
                        {[1,2].map(q=>(
                          <button key={q} className={`vespa-qty-btn${b.vehicleQty===q?" active":""}`}
                            onClick={e=>{e.stopPropagation();upd("vehicleQty",q);}}>
                            {q===1?s.qty1:s.qty2}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                  {b.vehicleId===v.id && b.duration && (
                    <div style={{textAlign:"center",padding:".5rem 0 .2rem",borderTop:"1px solid var(--border)",marginTop:".4rem"}}>
                      <span style={{fontFamily:"'Belleza',serif",fontSize:"1.1rem",color:"var(--gold)",letterSpacing:".06em",textTransform:"uppercase"}}>
                        {b.duration} {s.ore} — {fmt(v.prices[b.duration]*(v.id==="vespa"?b.vehicleQty:1))}
                      </span>
                    </div>
                  )}
                  <div className="picnic-badge">{s.picnicBanner}</div>
                  {vt(v,"notes",lang)&&<p className="v-note">&#183; {vt(v,"notes",lang)}</p>}
                  <button
                    className={`btn-sel ${b.vehicleId===v.id?"btn-sel-done":"btn-sel-idle"}`}
                    onClick={e=>{e.stopPropagation();upd("vehicleId",v.id);if(v.id!=="vespa")upd("vehicleQty",1);}}
                  >
                    {b.vehicleId===v.id ? s.btnSelOk : s.btnSel}
                  </button>
                </div>
              </div>
            ))}
          </div>
          <div style={{textAlign:"right"}}>
            <button className="btn-p" onClick={handleNext}>{s.btnNext} &#8594;</button>
          </div>
        </>}

        {/* STEP 2 — PROGRAMME & ADDONS */}
        {step===2&&<>
          <h2 className="sec-title">{s.s2t}</h2>
          <p className="sec-sub">{s.s2s}</p>
          {vehicle&&PROGRAMS[vehicle.id]&&(()=>{
            const prog=PROGRAMS[vehicle.id];
            return (
              <div className="prog-card">
                <div className="prog-head" style={{background:prog.gradient}}>
                  <span className="prog-badge">{prog.badge}</span>
                  <div className="prog-head-text">
                    <span className="prog-label">{{"it":"Programma suggerito","de":"Empfohlenes Programm","en":"Suggested programme","zh":"推荐行程"}[lang]}</span>
                    <span className="prog-theme">{vt(prog,"theme",lang)}</span>
                    <p className="prog-desc">{vt(prog,"desc",lang)}</p>
                  </div>
                </div>
                <div className="prog-stops">
                  {(prog.stops[lang]||prog.stops.en).map((stop,i)=>{
                    const linkKey = prog.stopLinks&&Object.keys(prog.stopLinks).find(k=>stop.includes(k));
                    const url = linkKey&&prog.stopLinks[linkKey];
                    return url
                      ? <a key={i} href={url} target="_blank" rel="noreferrer"
                          className="prog-stop" style={{textDecoration:"none",cursor:"pointer",borderBottom:"1px dashed rgba(255,255,255,.4)"}}>
                          📍 {stop} ↗
                        </a>
                      : <span key={i} className="prog-stop">📍 {stop}</span>;
                  })}
                </div>
              </div>
            );
          })()}
          <div className="addon-grid">
            {["","bollicine","fiori","camera","avventura"].map(cat=>{
              const group=ADDONS.filter(a=>cat===""?!a.category:a.category===cat);
              if(!group.length) return null;
              const catLabel={"bollicine":{it:"Bollicine & Champagne",de:"Schaumwein & Champagner",en:"Bubbles & Champagne",zh:"起泡酒与香槟"},"fiori":{it:"Fiori & Romanticismo",de:"Blumen & Romantik",en:"Flowers & Romance",zh:"鲜花与浪漫"},"camera":{it:"Sorprese in Camera",de:"Zimmer-Überraschungen",en:"Room Surprises",zh:"房间惊喜"},"avventura":{it:"Esperienze Avventura",de:"Abenteuer-Erlebnisse",en:"Adventure Experiences",zh:"冒险体验"}}[cat];
              return (<div key={cat||"main"}>
                {cat&&<span className="addon-category-label">{catLabel?.[lang]||catLabel?.en}</span>}
                {group.map(addon=>{
                  const sel=b.addons.includes(addon.id);
                  const toggle=e=>{e.stopPropagation();upd("addons",sel?b.addons.filter(x=>x!==addon.id):[...b.addons,addon.id]);};
                  return (
                    <div key={addon.id} className={`addon-card${sel?" sel":""}`}>
                      <div className="addon-card-inner">
                        <div className="addon-icon-col">{addon.icon}</div>
                        <div className="addon-content">
                          <div className="addon-top">
                            <div>
                              <span className="addon-tag">{vt(addon,"tags",lang)}</span>
                              <div className="addon-name">{vt(addon,"names",lang)}</div>
                            </div>
                            <span className="addon-price-badge">{fmt(addon.price)}</span>
                          </div>
                          <p className="addon-desc">{vt(addon,"descs",lang)}</p>
                          {addon.url&&<div style={{marginBottom:".6rem"}}>
                            <a href={addon.url} target="_blank" rel="noreferrer"
                              style={{display:"inline-flex",alignItems:"center",gap:".3rem",
                                      fontSize:".72rem",color:"#A67C52",fontWeight:700,
                                      letterSpacing:".04em",textDecoration:"underline",
                                      textUnderlineOffset:"3px"}}
                              onClick={e=>e.stopPropagation()}>
                              {{"it":"→ Sito ufficiale","de":"→ Offizielle Website","en":"→ Official website","zh":"→ 官方网站"}[lang]}
                            </a>
                            <p style={{fontSize:".68rem",color:"#8A7E74",fontStyle:"italic",
                                       marginTop:".25rem",fontWeight:400}}>
                              * {{"it":"Attività non inclusa nel prezzo — prenotazione e pagamento direttamente con il partner",
                                  "de":"Nicht im Preis enthalten — Buchung und Zahlung direkt beim Partner",
                                  "en":"Activity not included in price — book and pay directly with the partner",
                                  "zh":"费用不含此活动 — 请直接向合作伙伴预订并付款"}[lang]}
                            </p>
                          </div>}
                          <div className="addon-footer">
                            <span className="addon-per">
                              {{"it":"per 2 persone","de":"für 2 Personen","en":"for 2 people","zh":"双人份"}[lang]}
                              {addon.id==="raclette"&&<span style={{marginLeft:".4rem",color:"var(--subtle)"}}>· {{"it":"bevande escluse","de":"Getränke exkl.","en":"drinks not incl.","zh":"饮品另计"}[lang]}</span>}
                            </span>
                            <button className={`btn-addon ${sel?"btn-addon-added":"btn-addon-add"}`} onClick={toggle}>
                              {sel
                              ? s.btnAdded
                              : addon.price===0
                                ? {it:"AGGIUNGI (gratuito)",de:"HINZUFÜGEN (kostenlos)",en:"ADD (free)",zh:"添加（免费）"}[lang]
                                : `${s.btnAdd} · ${fmt(addon.price)}`}
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>);
            })}
          </div>
          {addonTotal>0&&<div className="addon-total-bar">
            <span className="addon-total-lbl">{{"it":"Totale extra","de":"Extras gesamt","en":"Extras total","zh":"附加合计"}[lang]}</span>
            <span className="addon-total-val">{fmt(addonTotal)}</span>
          </div>}
          <div className="addon-skip"><span onClick={handleNext}>{{"it":"Salta — continua senza extra →","de":"Überspringen →","en":"Skip — continue without extras →","zh":"跳过 →"}[lang]}</span></div>
          <div className="btn-row">
            <button className="btn-s" onClick={()=>setStep(1)}>← {s.btnBack}</button>
            <button className="btn-p" onClick={handleNext}>{s.btnNext} →</button>
          </div>
        </>}

        {/* STEP 3 — DATE & TIME */}
        {step===3&&<>
          <h2 className="sec-title">{s.dat_t}</h2>
          <p className="sec-sub">{s.dat_s(vehicle,lang)}</p>
          <div style={{marginBottom:"1.3rem"}}>
            <div className="lbl-row"><label className="flbl">📅 {s.dateL}</label>{errors.date&&<span className="lbl-err">⚠ {errors.date}</span>}</div>
            <input type="date" className={`finp${errors.date?" err":""}`} min={today} value={b.date} onChange={e=>upd("date",e.target.value)}/>
          </div>
          <div style={{marginBottom:"1.3rem"}}>
            <div className="lbl-row"><label className="flbl">⏱ {s.durL}</label>{errors.duration&&<span className="lbl-err">⚠ {errors.duration}</span>}</div>
            <div className="opt-grid">
              {[2,4,6].map(h=>(
                <div key={h} className={`opt-btn${b.duration===h?" sel":""}`} onClick={()=>upd("duration",h)}>
                  {h} {s.ore}
                  <span className="opt-price">{price!==null&&b.duration!==h?fmt((vehicle?.prices[h]||0)*(vehicleIsVespa?b.vehicleQty:1)):""}</span>
                </div>
              ))}
            </div>
            {b.duration===6&&<div className="picnic-alert">🧺 {s.picnicBanner}</div>}
          </div>
          <div style={{marginBottom:"1.3rem"}}>
            <div className="lbl-row"><label className="flbl">🕗 {s.timeL}</label>{errors.time&&<span className="lbl-err">⚠ {errors.time}</span>}</div>
            <div className="time-grid">
              {b.duration&&timeSlots(b.duration).map(t=>(
                <button key={t} type="button" className={`t-btn${b.time===t?" sel":""}`} onClick={()=>upd("time",t)}>{t}</button>
              ))}
            </div>
          </div>
          {isJag&&<div style={{marginBottom:"1.3rem"}}>
            <div className="lbl-row"><label className="flbl">📍 {s.pickupL}</label>{errors.pickupAddress&&<span className="lbl-err">⚠ {errors.pickupAddress}</span>}</div>
            <input className={`finp${errors.pickupAddress?" err":""}`} placeholder={s.pickupPh} value={b.pickupAddress} onChange={e=>upd("pickupAddress",e.target.value)}/>
          </div>}
          {price&&<div className="alert">
            {b.vehicleQty>1?`${b.vehicleQty}× `:""}
            {vehicle?.name} · {b.duration} {s.ore} → <strong>{fmt(price)}</strong>
            {addonTotal>0&&<> + {s.btnAdd.toLowerCase()} {fmt(addonTotal)} = <strong>{fmt(grandTotal)}</strong></>}
          </div>}
          <div className="btn-row">
            <button className="btn-s" onClick={()=>setStep(2)}>← {s.btnBack}</button>
            <button className="btn-p" onClick={handleNext}>{s.btnNext} →</button>
          </div>
        </>}

        {/* STEP 4 — PERSONAL DATA */}
        {step===4&&<>
          <h2 className="sec-title">{s.s3t}</h2>
          <p className="sec-sub">{s.s3s}</p>
          <div className="form-grid">
            {/* Campi base — tutti i veicoli */}
            {[["nome",s.fnome],["cognome",s.fcognome],["email",s.femail,"email"],["cellulare",s.fcellulare,"tel"]].map(([f,lbl,type])=>(
              <div key={f} className="fg">
                <label className="flbl">{lbl}</label>
                <input type={type||"text"} className={`finp${errors[f]?" err":""}`} value={b[f]} onChange={e=>upd(f,e.target.value)}/>
                {errors[f]&&<span className="ferr">{errors[f]}</span>}
              </div>
            ))}
            {/* Data e luogo di nascita — solo Vespa e Topolino (necessari per contratto) */}
            {!isJag&&[["dataNascita",s.fdataNasc,"date"],["luogoNascita",s.fluogoNasc]].map(([f,lbl,type])=>(
              <div key={f} className="fg">
                <label className="flbl">{lbl}</label>
                <input type={type||"text"} className={`finp${errors[f]?" err":""}`} value={b[f]} onChange={e=>upd(f,e.target.value)}/>
                {errors[f]&&<span className="ferr">{errors[f]}</span>}
              </div>
            ))}
            {!isJag&&<>
              <div className="fsect full">{s.licSec}</div>
              {[["numPatente",s.fnumPat],["scadenzaPatente",s.fscadPat,"date"],["entePatente",s.fenteEm],["nazionePatente",s.fnazioneEm]].map(([f,lbl,type])=>(
                <div key={f} className="fg">
                  <label className="flbl">{lbl}</label>
                  <input type={type||"text"} className={`finp${errors[f]?" err":""}`} value={b[f]} onChange={e=>upd(f,e.target.value)}/>
                  {errors[f]&&<span className="ferr">{errors[f]}</span>}
                </div>
              ))}
            </>}
          </div>
          {b.addons.some(id=>["prosecco","champagne","bouquet-alpino","rose-rosse","torta-compleanno"].includes(id))&&(
            <div className="regalo-box">
              <label className="ck-row" style={{marginBottom:".7rem",cursor:"pointer"}}>
                <input type="checkbox" checked={b.isGift} onChange={e=>upd("isGift",e.target.checked)}/>
                <span className="ck-txt"><strong>{s.isGiftLbl}</strong><br/>
                  <span style={{fontSize:".72rem",fontWeight:300,color:"var(--muted)"}}>{s.isGiftSub}</span>
                </span>
              </label>
              {b.addons.some(id=>["bouquet-alpino","rose-rosse"].includes(id))&&(
                <div style={{marginTop:".6rem"}}>
                  <label className="flbl" style={{display:"block",marginBottom:".35rem"}}>{s.giftMsgLbl}</label>
                  <textarea className="finp" rows={3} placeholder={s.giftMsgPh} value={b.giftMessage} onChange={e=>upd("giftMessage",e.target.value)} style={{resize:"vertical",fontFamily:"'Belleza',serif",fontSize:"1rem",lineHeight:1.6}}/>
                </div>
              )}
              {b.addons.includes("torta-compleanno")&&(
                <div style={{marginTop:".6rem"}}>
                  <label className="flbl" style={{display:"block",marginBottom:".35rem"}}>{s.birthdayLbl}</label>
                  <input className="finp" placeholder={s.birthdayPh} value={b.birthdayName} onChange={e=>upd("birthdayName",e.target.value)}/>
                </div>
              )}
            </div>
          )}
          <div className="btn-row">
            <button className="btn-s" onClick={()=>setStep(3)}>← {s.btnBack}</button>
            <button className="btn-p" onClick={handleNext}>{s.btnSum} →</button>
          </div>
        </>}

        {/* STEP 5 — CONFIRM */}
        {step===5&&<>
          <h2 className="sec-title">{s.s4t}</h2>
          <p className="sec-sub">{s.s4s}</p>
          <div className="sum-card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:".9rem",flexWrap:"wrap",gap:".5rem"}}>
              <div className="sum-veh" style={{margin:0}}>
                {vehicleIsVespa&&b.vehicleQty===2?"2× ":""}{vehicle?.name} — {vt(vehicle,"subtitles",lang)}
              </div>
              {b.bookingNumber&&<div style={{fontFamily:"'Belleza',serif",fontSize:".88rem",color:"var(--gold-light)",letterSpacing:".1em",fontWeight:600}}>N° {b.bookingNumber}</div>}
            </div>
            {b.bookingNumber&&<div className="sum-row">
              <span className="sum-lbl">{{"it":"N° Prenotazione","de":"Buchungsnummer","en":"Booking No.","zh":"预订号码"}[lang]||"N°"}</span>
              <span className="sum-val" style={{fontFamily:"'Belleza',serif",fontSize:"1.05rem",color:"var(--gold-light)",fontWeight:600,letterSpacing:".06em"}}>{b.bookingNumber}</span>
            </div>}
            <div className="sum-row"><span className="sum-lbl">{s.rCliente}</span><span className="sum-val">{b.nome} {b.cognome}</span></div>
            <div className="sum-row"><span className="sum-lbl">{s.rData}</span><span className="sum-val">{b.date}</span></div>
            <div className="sum-row"><span className="sum-lbl">{s.rOrario}</span><span className="sum-val">{b.time} → {endTime(b.time,b.duration)} ({b.duration} {s.ore})</span></div>
            {b.duration===6&&<div className="sum-row"><span className="sum-lbl">🧺 Picnic</span><span className="sum-val" style={{color:"var(--gold)",fontWeight:500}}>{s.picnicShort}</span></div>}
            {b.addons.length>0&&b.addons.map(id=>{const a=ADDONS.find(x=>x.id===id);return a?(<div className="sum-row" key={id}><span className="sum-lbl">{a.icon} {vt(a,"names",lang)}</span><span className="sum-val" style={{color:"var(--gold-light)"}}>{fmt(a.price)}</span></div>):null;})}
            {b.addons.length>0&&<div className="sum-row"><span className="sum-lbl">{{"it":"Totale mezzo","de":"Fahrzeug","en":"Vehicle","zh":"车辆"}[lang]}</span><span className="sum-val">{fmt(price)}</span></div>}
            <div className="sum-row"><span className="sum-lbl">{s.rTotale}</span><span className="sum-price">{fmt(grandTotal)}</span></div>
          </div>
          {/* Terms */}
          <div className="terms-box">
            <label className="ck-row"><input type="checkbox" checked={b.acceptPrivacy} onChange={e=>upd("acceptPrivacy",e.target.checked)}/>
            <span className="ck-txt">
              <span dangerouslySetInnerHTML={{__html:s.privTxt}}/>
              {" "}<span className="cond-link" onClick={e=>{e.preventDefault();setShowPrivacy(true);}}>
                {{"it":"→ Leggi l'informativa completa","de":"→ Vollständige Datenschutzerklärung","en":"→ Read full privacy notice","zh":"→ 阅读完整隐私政策"}[lang]||"→ Read"}
              </span>
            </span></label>
            {errors.acceptPrivacy&&<p className="ferr" style={{marginTop:".4rem"}}>⚠ {errors.acceptPrivacy}</p>}
          </div>
          <div className="terms-box">
            <label className="ck-row"><input type="checkbox" checked={b.acceptConditions} onChange={e=>upd("acceptConditions",e.target.checked)}/>
            <span className="ck-txt" dangerouslySetInnerHTML={{__html:s.condTxt}}/></label>
            <span className="cond-link" style={{display:"block",marginTop:".4rem",fontSize:".72rem"}} onClick={()=>setShowConditions(true)}>
              {{"it":"→ Leggi le condizioni complete","de":"→ Vollständige Bedingungen lesen","en":"→ Read full terms","zh":"→ 阅读完整条款"}[lang]}
            </span>
            {errors.acceptConditions&&<p className="ferr" style={{marginTop:".4rem"}}>⚠ {errors.acceptConditions}</p>}
          </div>
          {/* Pickup callout */}
          <div className="pickup-callout">
            {isJag&&<div className="pickup-callout-icon">🐆</div>}
            <div className="pickup-callout-text">
              <span className="pickup-callout-title">{isJag?s.footJag:s.footKey}</span>
              {!isJag&&<span className="pickup-callout-sub">Smart Hotel Saslong · Via Pallua 40 · 39047 Santa Cristina · +39 0471 774444</span>}
            </div>
          </div>
          {/* Map card */}
          {!isJag&&<div style={{marginBottom:"1.4rem"}}>
            <label className="flbl" style={{display:"block",marginBottom:".45rem"}}>{s.pickPt}</label>
            <p style={{fontSize:".78rem",color:"var(--muted)",marginBottom:".65rem",fontWeight:300}}>{s.pickPtAddr}</p>
            <div className="map-card">
              <div className="map-card-info">
                <span className="map-card-name">Smart Hotel Saslong</span>
                <span className="map-card-addr">Via Pallua 40 · 39047 Santa Cristina Valgardena (BZ)</span>
                <span className="map-card-tel">+39 0471 774444</span>
              </div>
              <a href="https://maps.app.goo.gl/wymNzDG1JsSoHg8j8" target="_blank" rel="noreferrer" className="btn-map-link">
                {{"it":"Apri in Google Maps","de":"In Google Maps öffnen","en":"Open in Google Maps","zh":"在谷歌地图中打开"}[lang]}
              </a>
            </div>
          </div>}
          <div className="divider"/>
          <p className="footer-note">{s.foot(b.email)}<br/>Saslong Srl · Via Rezia 308 · 39046 Ortisei (BZ) · www.saslong.ai</p>
          <div className="btn-row">
            <button className="btn-s" onClick={()=>setStep(4)}>← {s.btnBack}</button>
            <button className="btn-p" onClick={handleSubmit} disabled={sending}>{sending?s.btnSending:s.btnConf}</button>
          </div>
        </>}
      </div>
      {showConditions&&<ConditionsModal lang={lang} onClose={()=>setShowConditions(false)}/>}
      {showPrivacy&&<PrivacyModal lang={lang} onClose={()=>setShowPrivacy(false)}/>}
    </div>
  );
}
const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(React.createElement(ErrorBoundary, null, React.createElement(AlpstayMobility)));
  </script>

    (function(){ if(window.emailjs){ emailjs.init({ publicKey: "65-IyBQx_A0DUK8-N" }); window.emailjs = emailjs; } })();
  </script>
</body>
